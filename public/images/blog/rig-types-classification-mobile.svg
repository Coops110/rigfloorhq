<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 820" role="img" aria-labelledby="rtmTitle rtmDesc">
  <title id="rtmTitle">Drilling rig types classified by how they are supported</title>
  <desc id="rtmDesc">Six rig types stacked in order of increasing water depth. A land rig stands on the ground with no water at all. Three bottom-supported offshore types transfer their weight to the seabed: a submersible barge rests its flooded hull on the bottom in under 70 feet, a jack-up lowers three legs to the seabed and lifts its hull clear of the waves in up to 400 feet, and a platform rig sits on a fixed steel jacket in up to 1,500 feet. Two floating types never touch the seabed and hold station instead: a semi-submersible floats on submerged pontoons held by moorings or thrusters in up to 12,000 feet, and a drillship is a ship hull held on dynamic positioning in up to 15,000 feet. The dividing line is whether the rig rests on the bottom or floats, and that is what the water depth limit is really measuring.</desc>

  <rect width="420" height="820" fill="#0e0f11"/>

  <!-- ============ GROUP: ONSHORE ============ -->
  <text x="12" y="20" fill="#e8a020" font-family="monospace" font-size="11" letter-spacing="2">ONSHORE</text>
  <line x1="86" y1="16" x2="408" y2="16" stroke="#2a3347" stroke-width="1"/>

  <!-- land rig -->
  <g transform="translate(0,30)">
    <rect x="12" y="34" width="140" height="80" fill="#1a1410" opacity="0.6"/>
    <line x1="12" y1="34" x2="152" y2="34" stroke="#6b5330" stroke-width="2"/>
    <rect x="66" y="26" width="32" height="8" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <path d="M72 26 L78 0 L86 0 L92 26 Z" fill="#1c2130" stroke="#e8a020" stroke-width="1.5"/>
    <line x1="75" y1="16" x2="89" y2="16" stroke="#e8a020" stroke-width="1"/>
    <text x="168" y="46" fill="#d1d8e4" font-family="monospace" font-size="15">LAND RIG</text>
    <text x="168" y="68" fill="#e8a020" font-family="monospace" font-size="13">no water</text>
    <text x="168" y="88" fill="#8892a4" font-family="monospace" font-size="10">stands on the ground</text>
  </g>

  <!-- ============ GROUP: BOTTOM-SUPPORTED ============ -->
  <text x="12" y="172" fill="#e8a020" font-family="monospace" font-size="11" letter-spacing="2">BOTTOM-SUPPORTED</text>
  <line x1="196" y1="168" x2="408" y2="168" stroke="#2a3347" stroke-width="1"/>

  <!-- barge -->
  <g transform="translate(0,182)">
    <rect x="12" y="34" width="140" height="80" fill="#12243a" opacity="0.55"/>
    <line x1="12" y1="34" x2="152" y2="34" stroke="#3d6b96" stroke-width="2"/>
    <rect x="12" y="52" width="140" height="62" fill="#2a3347"/>
    <line x1="12" y1="52" x2="152" y2="52" stroke="#4a5568" stroke-width="2"/>
    <rect x="58" y="38" width="48" height="14" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <rect x="66" y="30" width="32" height="8" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <path d="M72 30 L78 4 L86 4 L92 30 Z" fill="#1c2130" stroke="#e8a020" stroke-width="1.5"/>
    <line x1="75" y1="20" x2="89" y2="20" stroke="#e8a020" stroke-width="1"/>
    <text x="168" y="46" fill="#d1d8e4" font-family="monospace" font-size="15">BARGE</text>
    <text x="168" y="68" fill="#e8a020" font-family="monospace" font-size="13">to 70 ft</text>
    <text x="168" y="88" fill="#8892a4" font-family="monospace" font-size="10">hull rests on bottom</text>
  </g>

  <!-- jack-up -->
  <g transform="translate(0,302)">
    <rect x="12" y="34" width="140" height="80" fill="#12243a" opacity="0.55"/>
    <line x1="12" y1="34" x2="152" y2="34" stroke="#3d6b96" stroke-width="2"/>
    <rect x="12" y="74" width="140" height="40" fill="#2a3347"/>
    <line x1="12" y1="74" x2="152" y2="74" stroke="#4a5568" stroke-width="2"/>
    <rect x="54" y="24" width="56" height="12" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <line x1="64" y1="36" x2="64" y2="74" stroke="#d1d8e4" stroke-width="2.5"/>
    <line x1="82" y1="36" x2="82" y2="74" stroke="#d1d8e4" stroke-width="2.5"/>
    <line x1="100" y1="36" x2="100" y2="74" stroke="#d1d8e4" stroke-width="2.5"/>
    <path d="M70 24 L76 0 L84 0 L90 24 Z" fill="#1c2130" stroke="#e8a020" stroke-width="1.5"/>
    <line x1="73" y1="14" x2="87" y2="14" stroke="#e8a020" stroke-width="1"/>
    <text x="168" y="46" fill="#d1d8e4" font-family="monospace" font-size="15">JACK-UP</text>
    <text x="168" y="68" fill="#e8a020" font-family="monospace" font-size="13">to 400 ft</text>
    <text x="168" y="88" fill="#8892a4" font-family="monospace" font-size="10">legs down, hull lifted</text>
  </g>

  <!-- platform -->
  <g transform="translate(0,422)">
    <rect x="12" y="34" width="140" height="80" fill="#12243a" opacity="0.55"/>
    <line x1="12" y1="34" x2="152" y2="34" stroke="#3d6b96" stroke-width="2"/>
    <rect x="12" y="92" width="140" height="22" fill="#2a3347"/>
    <line x1="12" y1="92" x2="152" y2="92" stroke="#4a5568" stroke-width="2"/>
    <rect x="58" y="24" width="48" height="12" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <path d="M64 36 L54 92 M100 36 L110 92" stroke="#d1d8e4" stroke-width="2"/>
    <path d="M61 52 L103 52 M58 72 L106 72" stroke="#d1d8e4" stroke-width="1"/>
    <path d="M64 36 L103 52 M100 36 L61 52" stroke="#d1d8e4" stroke-width="0.8" opacity="0.6"/>
    <path d="M72 24 L78 0 L86 0 L92 24 Z" fill="#1c2130" stroke="#e8a020" stroke-width="1.5"/>
    <line x1="75" y1="14" x2="89" y2="14" stroke="#e8a020" stroke-width="1"/>
    <text x="168" y="46" fill="#d1d8e4" font-family="monospace" font-size="15">PLATFORM</text>
    <text x="168" y="68" fill="#e8a020" font-family="monospace" font-size="13">to 1,500 ft</text>
    <text x="168" y="88" fill="#8892a4" font-family="monospace" font-size="10">fixed steel jacket</text>
  </g>

  <!-- ============ GROUP: FLOATING ============ -->
  <text x="12" y="564" fill="#e8a020" font-family="monospace" font-size="11" letter-spacing="2">FLOATING</text>
  <line x1="98" y1="560" x2="408" y2="560" stroke="#2a3347" stroke-width="1"/>

  <!-- semi-submersible -->
  <g transform="translate(0,574)">
    <rect x="12" y="34" width="140" height="80" fill="#12243a" opacity="0.55"/>
    <line x1="12" y1="34" x2="152" y2="34" stroke="#3d6b96" stroke-width="2"/>
    <rect x="54" y="24" width="56" height="10" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <line x1="68" y1="34" x2="68" y2="54" stroke="#d1d8e4" stroke-width="3"/>
    <line x1="96" y1="34" x2="96" y2="54" stroke="#d1d8e4" stroke-width="3"/>
    <rect x="58" y="54" width="22" height="11" rx="4" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <rect x="86" y="54" width="22" height="11" rx="4" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <path d="M60 65 L44 100 M106 65 L122 100" stroke="#8892a4" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M72 24 L78 0 L86 0 L92 24 Z" fill="#1c2130" stroke="#e8a020" stroke-width="1.5"/>
    <line x1="75" y1="14" x2="89" y2="14" stroke="#e8a020" stroke-width="1"/>
    <text x="82" y="112" fill="#4a5568" font-family="monospace" font-size="14" text-anchor="middle">≈</text>
    <text x="168" y="46" fill="#d1d8e4" font-family="monospace" font-size="15">SEMI-SUB</text>
    <text x="168" y="68" fill="#e8a020" font-family="monospace" font-size="13">to 12,000 ft</text>
    <text x="168" y="88" fill="#8892a4" font-family="monospace" font-size="10">moored or thrusters</text>
  </g>

  <!-- drillship -->
  <g transform="translate(0,694)">
    <rect x="12" y="34" width="140" height="80" fill="#12243a" opacity="0.55"/>
    <line x1="12" y1="34" x2="152" y2="34" stroke="#3d6b96" stroke-width="2"/>
    <path d="M50 34 L55 52 L109 52 L114 34 Z" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <rect x="60" y="26" width="44" height="8" fill="#1c2130" stroke="#d1d8e4" stroke-width="1.5"/>
    <path d="M74 26 L80 2 L88 2 L94 26 Z" fill="#1c2130" stroke="#e8a020" stroke-width="1.5"/>
    <line x1="77" y1="16" x2="91" y2="16" stroke="#e8a020" stroke-width="1"/>
    <line x1="82" y1="52" x2="82" y2="100" stroke="#e8a020" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="60" cy="54" r="3" fill="#8892a4"/>
    <circle cx="104" cy="54" r="3" fill="#8892a4"/>
    <text x="82" y="112" fill="#4a5568" font-family="monospace" font-size="14" text-anchor="middle">≈</text>
    <text x="168" y="46" fill="#d1d8e4" font-family="monospace" font-size="15">DRILLSHIP</text>
    <text x="168" y="68" fill="#e8a020" font-family="monospace" font-size="13">to 15,000 ft</text>
    <text x="168" y="88" fill="#8892a4" font-family="monospace" font-size="10">dynamic positioning</text>
  </g>
</svg>
