<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="dsTitle dsDesc">
  <title id="dsTitle">How differential sticking pins the drill string to the wellbore wall</title>
  <desc id="dsDesc">Cross-section of a wellbore. On the left the pipe is centred and mud surrounds it, so hydrostatic pressure acts evenly and the pipe is free. On the right the pipe rests against filter cake on a permeable formation. Mud cannot reach the contact area, so that face sees lower formation pressure while the rest of the pipe sees full hydrostatic pressure. The resulting differential pressure holds the pipe against the wall.</desc>

  <rect width="900" height="470" fill="#0e0f11"/>

  <!-- ================= LEFT: free pipe ================= -->
  <text x="30" y="34" fill="#8892a4" font-family="monospace" font-size="13" letter-spacing="1.5">FREE — MUD ALL ROUND</text>

  <!-- formation -->
  <rect x="30" y="52" width="60" height="360" fill="#2a3347"/>
  <rect x="330" y="52" width="60" height="360" fill="#2a3347"/>
  <!-- annulus / mud -->
  <rect x="90" y="52" width="240" height="360" fill="#16202e"/>
  <!-- pipe centred -->
  <rect x="180" y="52" width="60" height="360" rx="3" fill="#5b6577" stroke="#8892a4" stroke-width="2"/>

  <!-- even pressure arrows onto pipe -->
  <g stroke="#e8a020" stroke-width="2" fill="none" opacity="0.85">
    <path d="M140 120 L175 120" marker-end="url(#arrowAmber)"/>
    <path d="M140 210 L175 210" marker-end="url(#arrowAmber)"/>
    <path d="M140 300 L175 300" marker-end="url(#arrowAmber)"/>
    <path d="M280 120 L245 120" marker-end="url(#arrowAmber)"/>
    <path d="M280 210 L245 210" marker-end="url(#arrowAmber)"/>
    <path d="M280 300 L245 300" marker-end="url(#arrowAmber)"/>
  </g>

  <text x="30" y="438" fill="#d1d8e4" font-family="sans-serif" font-size="14">Pressure acts evenly. Net side force ≈ 0.</text>
  <text x="30" y="458" fill="#8892a4" font-family="sans-serif" font-size="12.5">Mud circulates all the way round the pipe.</text>

  <!-- ================= RIGHT: stuck pipe ================= -->
  <g transform="translate(480,0)">
    <text x="0" y="34" fill="#c94a1f" font-family="monospace" font-size="13" letter-spacing="1.5">STUCK — SEALED CONTACT</text>

    <!-- impermeable formation left -->
    <rect x="0" y="52" width="55" height="360" fill="#2a3347"/>
    <!-- permeable formation right -->
    <rect x="330" y="52" width="60" height="360" fill="#3d3226"/>
    <!-- permeability dots -->
    <g fill="#7a6444">
      <circle cx="345" cy="90" r="3"/><circle cx="365" cy="130" r="3"/><circle cx="350" cy="175" r="3"/>
      <circle cx="370" cy="225" r="3"/><circle cx="347" cy="270" r="3"/><circle cx="366" cy="320" r="3"/>
      <circle cx="352" cy="365" r="3"/>
    </g>
    <text x="336" y="72" fill="#b99a5e" font-family="monospace" font-size="10">PERMEABLE</text>

    <!-- annulus -->
    <rect x="55" y="52" width="275" height="360" fill="#16202e"/>
    <!-- filter cake on permeable face -->
    <rect x="312" y="52" width="18" height="360" fill="#6b5b3e"/>
    <text x="196" y="72" fill="#8892a4" font-family="monospace" font-size="10">FILTER CAKE →</text>

    <!-- pipe pressed against cake -->
    <rect x="252" y="52" width="60" height="360" rx="3" fill="#5b6577" stroke="#c94a1f" stroke-width="2.5"/>

    <!-- sealed contact area highlight -->
    <rect x="306" y="150" width="8" height="160" fill="#c94a1f" opacity="0.85"/>

    <!-- full hydrostatic pushing from open side -->
    <g stroke="#e8a020" stroke-width="2.5" fill="none">
      <path d="M170 150 L246 150" marker-end="url(#arrowAmber)"/>
      <path d="M170 200 L246 200" marker-end="url(#arrowAmber)"/>
      <path d="M170 250 L246 250" marker-end="url(#arrowAmber)"/>
      <path d="M170 300 L246 300" marker-end="url(#arrowAmber)"/>
    </g>
    <text x="92" y="205" fill="#e8a020" font-family="monospace" font-size="11">FULL</text>
    <text x="92" y="220" fill="#e8a020" font-family="monospace" font-size="11">HYDROSTATIC</text>

    <!-- weak formation pressure pushing back over contact only -->
    <g stroke="#8892a4" stroke-width="1.6" fill="none" opacity="0.9">
      <path d="M338 190 L320 190" marker-end="url(#arrowGrey)"/>
      <path d="M338 270 L320 270" marker-end="url(#arrowGrey)"/>
    </g>

    <!-- contact area bracket -->
    <path d="M330 150 L344 150 M344 150 L344 310 M344 310 L330 310" stroke="#c94a1f" stroke-width="1.6" fill="none"/>
    <text x="350" y="222" fill="#c94a1f" font-family="monospace" font-size="10">CONTACT</text>
    <text x="350" y="236" fill="#c94a1f" font-family="monospace" font-size="10">AREA</text>

    <text x="0" y="438" fill="#d1d8e4" font-family="sans-serif" font-size="14">Mud is sealed out of the contact. Net force = ΔP × area.</text>
    <text x="0" y="458" fill="#8892a4" font-family="sans-serif" font-size="12.5">Both ΔP and contact area grow the longer the pipe sits still.</text>
  </g>

  <!-- divider -->
  <line x1="440" y1="40" x2="440" y2="420" stroke="#2a3347" stroke-width="1.5" stroke-dasharray="5 6"/>

  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8a020"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8892a4"/>
    </marker>
  </defs>
</svg>
