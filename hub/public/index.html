<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<title>Social Hub</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <h1>Hub</h1>
  <div class="top-right">
    <span id="updated" class="muted">loading…</span>
    <button id="refresh" type="button" aria-label="Refresh all brands">Refresh</button>
  </div>
</header>

<main id="app" aria-live="polite">
  <p class="muted" id="loading">Loading…</p>
</main>

<section id="connect" class="connect">
  <h2>Connections</h2>
  <div id="providers" class="providers"></div>
  <div id="unassigned"></div>
  <p class="muted small">Tap a profile name on any card to open it in the app. <a href="/logout">Log out</a></p>
</section>

<template id="brand-tpl">
  <section class="brand">
    <header class="brand-head">
      <h2 class="brand-name"></h2>
      <div class="brand-meta"><a class="brand-site" target="_blank" rel="noopener"></a><button type="button" class="brand-refresh">Refresh</button></div>
    </header>
    <div class="cards"></div>
  </section>
</template>

<template id="card-tpl">
  <article class="card">
    <header class="card-head">
      <span class="net"></span>
      <a class="handle" target="_blank" rel="noopener"></a>
    </header>
    <div class="followers"><span class="big"></span><span class="label">followers</span><span class="delta"></span></div>
    <div class="totals"></div>
    <p class="note small muted"></p>
    <details class="posts">
      <summary>Recent posts</summary>
      <ol class="post-list"></ol>
    </details>
  </article>
</template>

<script src="/app.js" defer></script>
</body>
</html>
