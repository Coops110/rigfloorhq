<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0f; width: 1080px; height: 1920px; overflow: hidden; }
  * { font-family: Arial, sans-serif; box-sizing: border-box; }
  #stage { position: relative; width: 1080px; height: 1920px; }
  .eyebrow { position: absolute; top: 140px; left: 60px; right: 60px; color: #f07038; font-size: 30px; font-weight: 700; letter-spacing: 2px; opacity: 0; }
  .headline { position: absolute; top: 210px; left: 60px; right: 60px; color: #ffffff; font-size: 52px; font-weight: 700; line-height: 1.15; opacity: 0; }
  svg { position: absolute; top: 480px; left: 40px; }
  .label { fill: #cfd3d8; font-size: 30px; font-weight: 700; }
  .label-ok { fill: #4caf6a; font-size: 30px; font-weight: 700; }
  .label-bad { fill: #d9534f; font-size: 30px; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow" id="eyebrow">BOP STACK</div>
  <div class="headline" id="headline">Every ram is cut for<br>exactly one pipe size.</div>

  <svg width="1000" height="1000" viewBox="0 0 1000 1000">
    <!-- ram body -->
    <rect id="ramTop" x="150" y="200" width="300" height="90" fill="#3a3f4a" stroke="#f07038" stroke-width="4"/>
    <rect id="ramBottom" x="150" y="330" width="300" height="90" fill="#3a3f4a" stroke="#f07038" stroke-width="4"/>
    <text x="150" y="180" class="label">RAM</text>

    <!-- pipe (5 inch) -->
    <rect id="pipe5" x="270" y="150" width="60" height="330" fill="#8a8f99" opacity="1"/>
    <text id="pipe5Label" x="150" y="500" class="label">5" DRILL PIPE</text>

    <!-- pipe (3.5 inch), hidden initially -->
    <rect id="pipe35" x="285" y="150" width="30" height="330" fill="#8a8f99" opacity="0"/>
    <text id="pipe35Label" x="150" y="500" class="label" opacity="0">3½" DRILL PIPE</text>

    <!-- gap indicator for wrong-size seal -->
    <rect id="gapLeft" x="255" y="330" width="30" height="90" fill="#d9534f" opacity="0"/>
    <rect id="gapRight" x="315" y="330" width="30" height="90" fill="#d9534f" opacity="0"/>
    <text id="gapLabel" x="150" y="560" class="label-bad" opacity="0">GAP -- WILL NOT SEAL</text>
    <text id="sealLabel" x="150" y="560" class="label-ok" opacity="0">SEALS CORRECTLY</text>

    <!-- shear ram scene, hidden initially, positioned lower -->
    <g id="shearScene" opacity="0" transform="translate(0,560)">
      <rect x="150" y="0" width="300" height="90" fill="#3a3f4a" stroke="#f07038" stroke-width="4"/>
      <text x="470" y="45" class="label">CASING</text>
      <text x="470" y="80" class="label">SHEAR RAM</text>
      <rect id="pipeShear" x="270" y="-80" width="60" height="250" fill="#8a8f99"/>
      <rect id="pipeShearCutTop" x="270" y="-80" width="60" height="80" fill="#8a8f99"/>
      <rect id="pipeShearCutBottom" x="270" y="90" width="60" height="80" fill="#8a8f99" transform="translate(0,0)"/>
      <text id="wellOpenLabel" x="150" y="220" class="label-bad" opacity="0">WELL STILL OPEN</text>
      <rect id="blindRam" x="150" y="-180" width="300" height="90" fill="#3a3f4a" stroke="#f07038" stroke-width="4" opacity="0"/>
      <text id="blindRamLabel" x="150" y="-200" class="label" opacity="0">BLIND SHEAR RAM</text>
      <text id="sealedLabel" x="150" y="220" class="label-ok" opacity="0">NOW SEALED</text>
    </g>
  </svg>

  <div class="headline" id="closeText" style="top:1650px; font-size:44px; opacity:0;">Multiple ram types.<br>Not one "good enough" one.</div>
</div>

<script src="gsap.min.js"></script>
<script>
  // Cue timestamps from 10-bop-ram-size-cues.json, generated by
  // make-calc-narration.py -- keep these in sync if the script text changes.
  const L1 = 6.112, L2 = 14.775, L3 = 21.95, TOTAL = 26.025;

  const tl = gsap.timeline();

  // ---- line 1: intro, ram + correctly-fitted 5" pipe on screen ----
  tl.to('#eyebrow', { opacity: 1, duration: 0.5 }, 0.3)
    .to('#headline', { opacity: 1, duration: 0.6 }, 0.5)
    .to('#pipe5Label', { opacity: 1, duration: 0.4 }, 1.2)
    .to('#sealLabel', { opacity: 1, duration: 0.4 }, L1 - 1.5);

  // ---- line 2: swap to 3.5" pipe inside the same ram, show the gap ----
  tl.to('#headline', { opacity: 0, duration: 0.3 }, L1 + 0.1)
    .to('#pipe5', { opacity: 0, duration: 0.3 }, L1 + 0.3)
    .to('#pipe5Label', { opacity: 0, duration: 0.3 }, L1 + 0.3)
    .to('#sealLabel', { opacity: 0, duration: 0.3 }, L1 + 0.3)
    .to('#pipe35', { opacity: 1, duration: 0.3 }, L1 + 0.6)
    .to('#pipe35Label', { opacity: 1, duration: 0.3 }, L1 + 0.6)
    .to('#gapLeft', { opacity: 1, duration: 0.3 }, L1 + 1.0)
    .to('#gapRight', { opacity: 1, duration: 0.3 }, L1 + 1.0)
    .to('#gapLabel', { opacity: 1, duration: 0.3 }, L1 + 1.2);

  // ---- line 3: shear ram scene -- cuts pipe, well open, then blind ram closes ----
  tl.to('#gapLeft', { opacity: 0, duration: 0.3 }, L2 + 0.1)
    .to('#gapRight', { opacity: 0, duration: 0.3 }, L2 + 0.1)
    .to('#gapLabel', { opacity: 0, duration: 0.3 }, L2 + 0.1)
    .to('#pipe35', { opacity: 0, duration: 0.3 }, L2 + 0.1)
    .to('#pipe35Label', { opacity: 0, duration: 0.3 }, L2 + 0.1)
    .to('#shearScene', { opacity: 1, duration: 0.4 }, L2 + 0.5)
    .to('#pipeShearCutTop', { y: -20, duration: 0.5, ease: 'power1.in' }, L2 + 1.2)
    .to('#pipeShearCutBottom', { y: 20, duration: 0.5, ease: 'power1.in' }, L2 + 1.2)
    .to('#wellOpenLabel', { opacity: 1, duration: 0.3 }, L2 + 1.9)
    .to('#blindRam', { opacity: 1, duration: 0.4 }, L3 - 1.6)
    .to('#blindRamLabel', { opacity: 1, duration: 0.4 }, L3 - 1.6)
    .to('#wellOpenLabel', { opacity: 0, duration: 0.3 }, L3 - 1.1)
    .to('#sealedLabel', { opacity: 1, duration: 0.4 }, L3 - 0.9);

  // ---- line 4: close card ----
  tl.to('#shearScene', { opacity: 0, duration: 0.4 }, L3 + 0.3)
    .to('#closeText', { opacity: 1, duration: 0.6 }, L3 + 0.8)
    .to('#closeText', { opacity: 1, duration: 0.1 }, TOTAL);
</script>
</body>
</html>
